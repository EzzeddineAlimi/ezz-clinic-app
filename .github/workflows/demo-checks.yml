name: Fictional prototype checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install demo TypeScript compiler
        run: npm install --no-save --no-audit --no-fund typescript@5.8.3
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
