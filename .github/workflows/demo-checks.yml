name: Fictional prototype checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: prototype-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install demo TypeScript compiler
        run: npm install --no-save --no-audit --no-fund typescript@5.8.3
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
