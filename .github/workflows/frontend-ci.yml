name: Frontend real-API fictional clinic checks
on:
  push:
    branches: [main]
    paths: ['frontend/**', 'backend/**', '.github/workflows/frontend-ci.yml']
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fictional-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EZZ_TEST_ADMIN_URL: postgres://postgres:fictional-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: backend/.nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix backend ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix frontend ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix backend run typecheck
      - run: node --test test/s3b-checkout.test.ts
        working-directory: backend
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test:e2e
      - name: Install X11 desktop capture tool
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Dedicated headed test: real Chromium browser Ctrl+Plus, not CSS zoom or Playwright DPR emulation.
      - name: Native 200% desktop browser zoom for fictional dentist alerts
        working-directory: frontend
        env:
          EZZ_NATIVE_ZOOM: "1"
        run: xvfb-run -a npx playwright test e2e/native-browser-zoom.spec.ts --headed
      - name: Preserve fictional UI screenshots for visual review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fictional-ui-screenshots
          retention-days: 5
          if-no-files-found: warn
          path: |
            docs/images/sprint2/*.png
            # Explicit current-run risk-state captures; exclude historical committed checkout PNGs.
            docs/images/sprint3b/owner-fr-blind-count-before-reveal.png
            docs/images/sprint3b/owner-fr-complete-count-audit.png
            docs/images/sprint3b/dentist-fr-medical-alert-details.png
            docs/images/sprint3b/reception-fr-server-numbered-receipt-copy.png
            docs/images/sprint3b/dayboard-fr-200pct-css-zoom.png
            docs/images/sprint3b/dayboard-ar-200pct-css-zoom.png
            docs/images/sprint3b/dayboard-ar-landscape.png
            frontend/test-results/**/*.png
            frontend/test-results/**/*.pdf
            docs/testing/u029/*.pdf
