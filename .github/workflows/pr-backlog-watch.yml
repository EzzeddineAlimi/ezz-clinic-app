name: Open PR integration backlog guard
on:
  pull_request:
    paths:
      - 'scripts/governance/**'
      - '.github/workflows/pr-backlog-watch.yml'
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  queue-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Test PR queue guard
        run: node --test scripts/governance/pr-backlog-check.test.mjs
      - name: Audit full open PR inventory (read-only)
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/governance/pr-backlog-check.mjs
